plugins {
    id 'com.android.application'
}

android {
    namespace 'com.jhz.llamachatplusplus'
    compileSdk 33

    defaultConfig {
        applicationId 'com.jhz.llamachatplusplus'
        minSdk 28
        targetSdk 33
        versionCode 1
        versionName '1.0'
        // Only ABIs for which you built libllama_server.so (see tools/build-llama-server.sh)
        ndk { abiFilters 'arm64-v8a', 'armeabi-v7a', 'x86_64' }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_7
        targetCompatibility JavaVersion.VERSION_1_7
    }

    // llama-server is an executable shipped as libllama_server.so; it must be
    // extracted to nativeLibraryDir so we can exec it.
    packagingOptions {
        jniLibs {
            useLegacyPackaging = true
            keepDebugSymbols.add('**/libllama_server.so')
        }
    }

    lint { abortOnError false }
}

tasks.withType(JavaCompile) {
    options.compilerArgs << '-Xlint:-options'
}

// No dependencies on purpose: no AppCompat, no AndroidX.
